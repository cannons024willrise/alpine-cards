<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Deck Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171717;color:#eee;font-family:Arial,sans-serif;text-align:center}main{max-width:1000px;margin:30px auto;padding:0 15px}h1,h2{font-family:Georgia,serif}.deck-area{margin:25px 0}.deck-stack{position:relative;width:180px;height:230px;margin:20px auto}.deck-card{position:absolute;inset:0;width:180px;height:230px;object-fit:contain;;}.deck-card:nth-child(1){transform:translate(-10px,6px) rotate(-3deg)}.deck-card:nth-child(2){transform:translate(-5px,3px) rotate(-1.5deg)}.deck-card:nth-child(3){transform:translate(0,0)}button{margin:5px;padding:10px 15px;background:#2b251b;color:#fff;border:1px solid #806735;border-radius:7px;cursor:pointer}button:hover{background:#493b25}#message{margin:20px auto;min-height:35px}.drawn-card{max-width:220px;width:auto;max-height:320px;height:auto;object-fit:contain;;;margin:10px auto;display:block}.territories{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:35px}.territory{background:#222;border:1px solid #444;;padding:15px}.territory-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:12px;margin-top:15px}.territory-card img{width:100%;height:auto;display:block;object-fit:contain;aspect-ratio:auto;;}.territory-card b{display:block;margin-top:5px}small{color:#aaa}@media(max-width:700px){.territories{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>WORLD DECK</h1>
<small>Randomized World Deck · Player 1 draws TOP · Player 2 draws BOTTOM</small>
<div class="deck-area">
<div class="deck-stack" id="worldDeckVisual"></div>
<div id="remaining"></div>
<button onclick="drawWorld(1)">Player 1 — Draw Top</button>
<button onclick="drawWorld(2)">Player 2 — Draw Bottom</button>
<button onclick="newGame()">New Game</button>
</div>
<div id="message">No World Card drawn yet.</div>
<div class="territories">
<div class="territory"><h2>PLAYER 1 TERRITORY DECK</h2><div id="player1"></div></div>
<div class="territory"><h2>PLAYER 2 TERRITORY DECK</h2><div id="player2"></div></div>
</div>
</main>
<script>
const worldTypes={
River:{image:"river.png",capacity:6,buildings:["Farm","Residence","Tavern"]},
Mountain:{image:"mountain.png",capacity:4,buildings:["Quarry","Mine","Oilfield"]},
Forest:{image:"forest.png",capacity:2,buildings:["Forest (automatic)"]},
Meadow:{image:"meadow.png",capacity:7,buildings:["All other buildings"]}
};
let worldDeck=[],player1Territory=[],player2Territory=[];
function shuffle(deck){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
function createWorldDeck(){worldDeck=[];for(const type of Object.keys(worldTypes)){const copies=3+Math.floor(Math.random()*4);for(let i=0;i<copies;i++)worldDeck.push(type)}shuffle(worldDeck)}
function drawWorld(player){if(!worldDeck.length){showMessage("The World Deck is empty.");return}const card=player===1?worldDeck.shift():worldDeck.pop();(player===1?player1Territory:player2Territory).push(card);const data=worldTypes[card];document.getElementById("message").innerHTML=`<img class="drawn-card" src="${data.image}" alt="${card} Card"><b>Player ${player} acquired a ${card} World Card.</b><br><small>Building capacity: ${data.capacity}</small>`;renderAll()}
function renderWorldDeck(){const visual=document.getElementById("worldDeckVisual");const n=Math.min(3,worldDeck.length);if(!n){visual.innerHTML="<small>WORLD DECK EMPTY</small>";return}visual.innerHTML="";for(let i=0;i<n;i++){const img=document.createElement("img");img.src=worldTypes[worldDeck[i]].image;img.alt="World Card";img.className="deck-card";visual.appendChild(img)}}
function renderTerritory(territory){if(!territory.length)return "<small>Empty</small>";return `<div class="territory-cards">${territory.map(card=>{const data=worldTypes[card];return `<div class="territory-card"><img src="${data.image}" alt="${card} Card"><b>${card}</b><small>${data.capacity} building slots</small></div>`}).join("")}</div>`}
function renderAll(){renderWorldDeck();document.getElementById("remaining").innerText=`${worldDeck.length} World Cards remaining`;document.getElementById("player1").innerHTML=renderTerritory(player1Territory);document.getElementById("player2").innerHTML=renderTerritory(player2Territory)}
function showMessage(text){document.getElementById("message").innerHTML=text}
function newGame(){player1Territory=[];player2Territory=[];createWorldDeck();showMessage("New World Deck shuffled.");renderAll()}
newGame();
</script>
</body>
</html>
