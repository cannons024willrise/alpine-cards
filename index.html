<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>World Deck Prototype</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #171717;
    color: #eee;
    font-family: Arial, sans-serif;
    text-align: center;
}

main {
    width: min(1100px, 96%);
    margin: 30px auto;
}

h1,
h2 {
    font-family: Georgia, serif;
}

small {
    color: #aaa;
}


/* =========================================================
   BUTTONS
========================================================= */

button {
    margin: 5px;
    padding: 10px 15px;

    background: #2b251b;
    color: white;

    border: 1px solid #806735;
    border-radius: 7px;

    cursor: pointer;
}

button:hover {
    background: #493b25;
}


/* =========================================================
   WORLD DECK
========================================================= */

.world-section {
    margin-top: 25px;
}

.world-deck {
    position: relative;

    width: 180px;
    height: 230px;

    margin: 25px auto;
}

.world-card {
    position: absolute;

    left: 0;
    top: 0;

    width: 180px;
    height: 230px;

    object-fit: contain;

    transition:
        transform 0.25s ease;
}

.world-card:nth-child(1) {
    transform:
        translate(-8px, 5px)
        rotate(-3deg);
}

.world-card:nth-child(2) {
    transform:
        translate(-4px, 2px)
        rotate(-1.5deg);
}

.world-card:nth-child(3) {
    transform:
        translate(0, 0);
}


/* =========================================================
   DRAWN CARD
========================================================= */

#message {
    min-height: 50px;
    margin: 20px auto;
}

.drawn-card {
    display: block;

    width: 220px;
    max-width: 100%;

    height: auto;

    object-fit: contain;

    margin: 12px auto;
}


/* =========================================================
   TERRITORIES
========================================================= */

.territories {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 35px;

    margin-top: 45px;
}

.territory {
    background: #222;

    border: 1px solid #444;
    border-radius: 10px;

    padding: 20px;

    min-width: 0;
}


/* =========================================================
   TERRITORY DECK AREA
========================================================= */

.territory-deck-area {
    position: relative;

    min-height: 330px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;
}


/* =========================================================
   CLOSED TERRITORY DECK
========================================================= */

.territory-deck {
    position: relative;

    width: 180px;
    height: 230px;

    margin: 15px auto;

    cursor: pointer;
}


/*
   Every visible layer is the same physical
   deck, not a separate card grid.
*/

.territory-card {
    position: absolute;

    left: 0;
    top: 0;

    width: 180px;
    height: 230px;

    object-fit: contain;

    transform-origin: center bottom;

    transition:
        transform 0.50s cubic-bezier(.2,.8,.2,1),
        opacity 0.30s ease;
}


/*
   Closed deck hover.
*/

.territory-deck:not(.expanded):hover
.territory-card:last-child {
    transform:
        translateY(-8px);
}


/* =========================================================
   EXPANDED TERRITORY DECK
========================================================= */

.territory-deck.expanded {
    width: min(90vw, 820px);

    height: 340px;

    cursor: default;
}


/*
   Individual cards spread horizontally.
*/

.territory-deck.expanded
.territory-card {
    cursor: pointer;
}


/*
   Selected card rises above the spread.
*/

.territory-card.selected {
    transform:
        translateY(-25px)
        scale(1.05) !important;

    z-index: 9999 !important;
}


/* =========================================================
   DECK COUNT
========================================================= */

.deck-count {
    margin-top: 6px;

    color: #aaa;

    font-size: 14px;
}


/* =========================================================
   EMPTY DECK
========================================================= */

.empty-deck {
    width: 180px;
    height: 230px;

    margin: 15px auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 1px dashed #555;
    border-radius: 8px;

    color: #888;
}


/* =========================================================
   CLOSE DECK BUTTON
========================================================= */

.close-deck {
    margin-top: 10px;

    opacity: 0;

    transform:
        translateY(-10px);

    pointer-events: none;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}

.close-deck.visible {
    opacity: 1;

    transform:
        translateY(0);

    pointer-events: auto;
}


/* =========================================================
   TERRITORY CARD MODAL
========================================================= */

.modal-overlay {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(0, 0, 0, 0.72);

    padding: 20px;

    z-index: 10000;
}


.modal-overlay.open {
    display: flex;
}


/* =========================================================
   MODAL WINDOW
========================================================= */

.territory-modal {
    position: relative;

    width: min(850px, 95vw);

    min-height: 300px;

    max-height: 90vh;

    overflow: hidden;

    background: #222;

    border: 1px solid #806735;

    border-radius: 12px;

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.65);

    padding:
        40px 20px 25px;
}


/*
   Close button inside modal.
*/

.modal-close {
    position: absolute;

    top: 10px;
    right: 10px;

    width: 38px;
    height: 38px;

    margin: 0;

    padding: 0;

    background: #2b251b;

    color: white;

    border: 1px solid #806735;

    border-radius: 7px;

    font-size: 24px;

    line-height: 1;
}

.modal-close:hover {
    background: #493b25;
}


/* =========================================================
   SEVEN CARD SLOTS
========================================================= */

.modal-card-slots {
    display: flex;

    flex-direction: row;

    align-items: center;

    justify-content: center;

    gap: 12px;

    width: 100%;

    overflow-x: auto;

    overflow-y: hidden;

    padding:
        10px 5px 15px;

    margin-top: 15px;
}


/*
   Individual slot.

   Every slot has the same fixed size.
*/

.modal-card-slot {
    flex:
        0 0 95px;

    width: 95px;
    height: 135px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #191919;

    border:
        1px dashed
        #555;

    border-radius: 8px;

    color: #777;

    font-size: 13px;

    user-select: none;

    overflow: hidden;
}


/* =========================================================
   INTERNAL TERRITORY CARDS
========================================================= */

.internal-territory-card {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    pointer-events: none;
}


/*
   Empty slots remain visually empty.
*/

.modal-card-slot.empty {
    background: #191919;

    border:
        1px dashed
        #555;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 750px) {

    .territories {
        grid-template-columns: 1fr;
    }

    .territory-deck.expanded {
        width: 100%;
        height: 300px;
    }

    .territory-card {
        width: 135px;
        height: 175px;
    }

    .world-card {
        width: 160px;
        height: 205px;
    }

    .world-deck {
        width: 160px;
        height: 205px;
    }

    .territory-modal {
        width: 95vw;

        min-height: 260px;

        padding:
            40px 12px 20px;
    }


    /*
       The seven slots remain ONE line.
    */

    .modal-card-slots {
        justify-content: flex-start;

        gap: 10px;

        overflow-x: auto;
    }


    .modal-card-slot {
        flex:
            0 0 80px;

        width: 80px;
        height: 115px;
    }

}

</style>
</head>


<body>

<main>


<!-- =====================================================
     TITLE
===================================================== -->

<h1>WORLD DECK</h1>

<small>
    Randomized World Deck ·
    Player 1 draws TOP ·
    Player 2 draws BOTTOM
</small>


<!-- =====================================================
     SHARED WORLD DECK
===================================================== -->

<section class="world-section">

    <div
        id="worldDeckVisual"
        class="world-deck"
    ></div>


    <div id="remaining">
        0 World Cards remaining
    </div>


    <button onclick="drawWorld(1)">
        Player 1 — Draw Top
    </button>


    <button onclick="drawWorld(2)">
        Player 2 — Draw Bottom
    </button>


    <button onclick="newGame()">
        New Game
    </button>

</section>


<!-- =====================================================
     LAST DRAWN CARD
===================================================== -->

<div id="message">
    No World Card drawn yet.
</div>


<!-- =====================================================
     PLAYER TERRITORY DECKS
===================================================== -->

<section class="territories">


    <!-- =================================================
         PLAYER 1
    ================================================== -->

    <div class="territory">

        <h2>
            PLAYER 1 TERRITORY DECK
        </h2>


        <div
            id="player1Deck"
            class="territory-deck-area"
        ></div>

    </div>


    <!-- =================================================
         PLAYER 2
    ================================================== -->

    <div class="territory">

        <h2>
            PLAYER 2 TERRITORY DECK
        </h2>


        <div
            id="player2Deck"
            class="territory-deck-area"
        ></div>

    </div>

</section>

</main>


<!-- =====================================================
     TERRITORY CARD MODAL
===================================================== -->

<div
    id="territoryModal"
    class="modal-overlay"
>

    <div class="territory-modal">


        <button
            class="modal-close"
            onclick="closeTerritoryModal()"
            aria-label="Close"
        >
            ×
        </button>


        <!-- =============================================
             SEVEN INTERNAL CARD SLOTS
        ============================================== -->

        <div
            id="territoryModalContent"
            class="modal-card-slots"
        ></div>

    </div>

</div>


<script>

/* =========================================================
   WORLD CARD DEFINITIONS
========================================================= */

const worldTypes = {

    River: {

        image: "river.png",

        capacity: 6,

        buildings: [
            "Farm",
            "Residence",
            "Tavern"
        ]

    },


    Mountain: {

        image: "mountain.png",

        capacity: 4,

        buildings: [
            "Quarry",
            "Mine",
            "Oilfield"
        ]

    },


    Forest: {

        image: "forest.png",

        capacity: 2,

        buildings: [
            "Forest (automatic)"
        ]

    },


    Meadow: {

        image: "meadow.png",

        capacity: 7,

        buildings: [
            "All other buildings"
        ]

    }

};


/* =========================================================
   THREE SEPARATE DECKS
========================================================= */


/*
   Shared source.
*/

let worldDeck = [];


/*
   Player 1's completely separate deck.
*/

let player1TerritoryDeck = [];


/*
   Player 2's completely separate deck.
*/

let player2TerritoryDeck = [];


/*
   Which Territory Deck is currently expanded?

   null = both closed
   1    = Player 1 open
   2    = Player 2 open
*/

let openTerritory = null;


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(deck) {

    for (
        let i = deck.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            deck[i],
            deck[j]
        ] = [
            deck[j],
            deck[i]
        ];

    }

}


/* =========================================================
   CREATE RANDOMIZED WORLD DECK
========================================================= */

function createWorldDeck() {

    worldDeck = [];


    /*
       Randomly choose 3–6 copies
       of each World Card type.
    */

    for (
        const type of Object.keys(worldTypes)
    ) {

        const copies =
            3 +
            Math.floor(
                Math.random() * 4
            );


        for (
            let i = 0;
            i < copies;
            i++
        ) {

            worldDeck.push(type);

        }

    }


    shuffle(worldDeck);

}


/* =========================================================
   DRAW WORLD CARD
========================================================= */

function drawWorld(player) {

    if (worldDeck.length === 0) {

        showMessage(
            "The World Deck is empty."
        );

        return;

    }


    let card;


    /*
       Player 1:
       remove from TOP.
    */

    if (player === 1) {

        card =
            worldDeck.shift();


        /*
           Goes ONLY into Player 1's deck.
        */

        player1TerritoryDeck.push(
            card
        );

    }


    /*
       Player 2:
       remove from BOTTOM.
    */

    else {

        card =
            worldDeck.pop();


        /*
           Goes ONLY into Player 2's deck.
        */

        player2TerritoryDeck.push(
            card
        );

    }


    const data =
        worldTypes[card];


    showMessage(`

        <img
            class="drawn-card"
            src="${data.image}"
            alt="${card} Card"
        >

        <b>
            Player ${player}
            acquired a
            ${card}
            World Card.
        </b>

        <br>

        <small>
            Building capacity:
            ${data.capacity}
        </small>

    `);


    renderAll();

}


/* =========================================================
   WORLD DECK RENDERING
========================================================= */

function renderWorldDeck() {

    const container =
        document.getElementById(
            "worldDeckVisual"
        );


    container.innerHTML = "";


    if (worldDeck.length === 0) {

        container.innerHTML =
            "<small>WORLD DECK EMPTY</small>";

        return;

    }


    /*
       The World Deck is one actual deck.
       Only a few layers are shown visually.
    */

    const visible =
        Math.min(
            3,
            worldDeck.length
        );


    for (
        let i = 0;
        i < visible;
        i++
    ) {

        const img =
            document.createElement(
                "img"
            );


        img.src =
            worldTypes[
                worldDeck[i]
            ].image;


        img.alt =
            "World Deck";


        img.className =
            "world-card";


        container.appendChild(
            img
        );

    }

}


/* =========================================================
   TERRITORY DECK RENDERING
========================================================= */

function renderTerritoryDeck(
    player,
    deck
) {

    const container =
        document.getElementById(
            player === 1
                ? "player1Deck"
                : "player2Deck"
        );


    container.innerHTML = "";


    /* ================================================
       EMPTY
    ================================================ */

    if (deck.length === 0) {

        container.innerHTML = `

            <div class="empty-deck">
                EMPTY DECK
            </div>

            <div class="deck-count">
                0 cards
            </div>

        `;

        return;

    }


    /* ================================================
       CREATE THE ACTUAL DECK CONTAINER
    ================================================ */

    const deckElement =
        document.createElement(
            "div"
        );


    deckElement.className =
        "territory-deck";


    /*
       CLOSED
    */

    if (openTerritory !== player) {

        renderClosedTerritoryDeck(
            deckElement,
            deck,
            player
        );

    }


    /*
       OPEN
    */

    else {

        renderExpandedTerritoryDeck(
            deckElement,
            deck,
            player
        );

    }


    container.appendChild(
        deckElement
    );


    /*
       Card count.
    */

    const count =
        document.createElement(
            "div"
        );


    count.className =
        "deck-count";


    count.textContent =
        `${deck.length} card${
            deck.length === 1
                ? ""
                : "s"
        }`;


    container.appendChild(
        count
    );


    /*
       Close button.
    */

    if (openTerritory === player) {

        const closeButton =
            document.createElement(
                "button"
            );


        closeButton.className =
            "close-deck visible";


        closeButton.textContent =
            "Close Deck";


        closeButton.onclick =
            () => {

                closeTerritoryDeck(
                    player
                );

            };


        container.appendChild(
            closeButton
        );

    }

}


/* =========================================================
   CLOSED TERRITORY DECK
========================================================= */

function renderClosedTerritoryDeck(
    deckElement,
    deck,
    player
) {

    /*
       Show a few physical-looking
       layers of ONE deck.
    */

    const visible =
        Math.min(
            4,
            deck.length
        );


    for (
        let i = 0;
        i < visible;
        i++
    ) {

        const card =
            deck[i];


        const img =
            document.createElement(
                "img"
            );


        img.src =
            worldTypes[card].image;


        img.alt =
            "";


        img.className =
            "territory-card";


        img.style.zIndex =
            i;


        img.style.transform =
            `
                translate(
                    ${i * 3}px,
                    ${i * -2}px
                )
            `;


        deckElement.appendChild(
            img
        );

    }


    /*
       Clicking the compact deck opens
       THIS player's deck.
    */

    deckElement.onclick =
        () => {

            openTerritoryDeck(
                player
            );

        };

}


/* =========================================================
   EXPANDED TERRITORY DECK
========================================================= */

function renderExpandedTerritoryDeck(
    deckElement,
    deck,
    player
) {

    deckElement.classList.add(
        "expanded"
    );


    const total =
        deck.length;


    /*
       Width used by the fan.
    */

    const availableWidth =
        Math.min(
            740,
            Math.max(
                300,
                window.innerWidth - 100
            )
        );


    /*
       Distance between cards.

       More cards = tighter spread.
    */

    const spacing =
        Math.min(
            145,
            availableWidth /
            Math.max(
                total,
                1
            )
        );


    /*
       Center point of the deck.
    */

    const centre =
        (total - 1) / 2;


    /*
       Display EVERY card.
    */

    deck.forEach(
        (card, index) => {

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                worldTypes[card].image;


            img.alt =
                `${card} Card`;


            img.className =
                "territory-card";


            /*
               Start cards as stacked.
               Browser animation will then
               transition them to their spread.
            */

            img.style.transform =
                `
                    translateX(0)
                    translateY(0)
                    rotate(0deg)
                `;


            img.style.zIndex =
                100 + index;


            deckElement.appendChild(
                img
            );


            /*
               Trigger the spread animation
               on the next frame.
            */

            requestAnimationFrame(
                () => {

                    const x =
                        (
                            index -
                            centre
                        ) * spacing;


                    const rotation =
                        (
                            index -
                            centre
                        ) *
                        Math.min(
                            5,
                            35 /
                            Math.max(
                                total,
                                1
                            )
                        );


                    img.style.transform =
                        `
                            translateX(${x}px)
                            translateY(0)
                            rotate(${rotation}deg)
                        `;

                }
            );


            /*
               Clicking an expanded card
               selects it visually and opens
               its territory modal.
            */

            img.onclick =
                (event) => {

                    event.stopPropagation();


                    /*
                       Remove selection from
                       every other card.
                    */

                    deckElement
                        .querySelectorAll(
                            ".territory-card.selected"
                        )
                        .forEach(
                            selectedCard => {

                                selectedCard.classList.remove(
                                    "selected"
                                );

                            }
                        );


                    /*
                       Select this card.
                    */

                    img.classList.add(
                        "selected"
                    );


                    /*
                       Open the modal for
                       this territory type.
                    */

                    openTerritoryModal(
                        player,
                        card
                    );

                };

        }
    );


    /*
       Clicking the empty area of the expanded
       deck closes it.
    */

    deckElement.onclick =
        (event) => {

            if (
                event.target ===
                deckElement
            ) {

                closeTerritoryDeck(
                    player
                );

            }

        };

}


/* =========================================================
   OPEN TERRITORY DECK
========================================================= */

function openTerritoryDeck(player) {

    openTerritory =
        player;


    renderAll();

}


/* =========================================================
   CLOSE TERRITORY DECK
========================================================= */

function closeTerritoryDeck(player) {

    /*
       Only close the deck that is open.
    */

    if (
        openTerritory === player
    ) {

        openTerritory =
            null;


        renderAll();

    }

}


/* =========================================================
   BUILD INTERNAL TERRITORY SLOTS
========================================================= */

/*
   Every Territory Card has seven internal
   slots.

   Slot numbering:

   1  2  3  4  5  6  7

   Mountain:
   3 Mountain Cards occupy slots 3, 4, 5.

   River:
   1 River Card occupies slot 4.

   Forest:
   5 Forest Cards occupy slots 2, 3, 4, 5, 6.

   Meadow:
   All slots remain empty.
*/

function getTerritorySlotCards(cardType) {

    const slots =
        [
            null,
            null,
            null,
            null,
            null,
            null,
            null
        ];


    /*
       MOUNTAIN
       Center three slots.
    */

    if (
        cardType === "Mountain"
    ) {

        slots[2] = "Mountain";
        slots[3] = "Mountain";
        slots[4] = "Mountain";

    }


    /*
       RIVER
       Exact center slot.
    */

    else if (
        cardType === "River"
    ) {

        slots[3] = "River";

    }


    /*
       FOREST
       Center five slots.
    */

    else if (
        cardType === "Forest"
    ) {

        slots[1] = "Forest";
        slots[2] = "Forest";
        slots[3] = "Forest";
        slots[4] = "Forest";
        slots[5] = "Forest";

    }


    /*
       MEADOW
       All seven remain empty.
    */


    return slots;

}


/* =========================================================
   OPEN TERRITORY CARD MODAL
========================================================= */

function openTerritoryModal(
    player,
    card
) {

    const modal =
        document.getElementById(
            "territoryModal"
        );


    const content =
        document.getElementById(
            "territoryModalContent"
        );


    /*
       Get the internal seven-slot arrangement
       for this specific Territory Card.
    */

    const slotCards =
        getTerritorySlotCards(
            card
        );


    /*
       Recreate all seven slots.
    */

    content.innerHTML = "";


    slotCards.forEach(
        (slotCard, index) => {

            const slot =
                document.createElement(
                    "div"
                );


            slot.className =
                "modal-card-slot";


            /*
               EMPTY SLOT
            */

            if (
                slotCard === null
            ) {

                slot.classList.add(
                    "empty"
                );

            }


            /*
               OCCUPIED SLOT
            */

            else {

                const internalCard =
                    document.createElement(
                        "img"
                    );


                internalCard.className =
                    "internal-territory-card";


                internalCard.src =
                    worldTypes[
                        slotCard
                    ].image;


                internalCard.alt =
                    `${slotCard} Card`;


                slot.appendChild(
                    internalCard
                );

            }


            /*
               Seven slots always exist,
               regardless of territory type.
            */

            content.appendChild(
                slot
            );

        }
    );


    /*
       Open the modal.
    */

    modal.classList.add(
        "open"
    );

}


/* =========================================================
   CLOSE TERRITORY CARD MODAL
========================================================= */

function closeTerritoryModal() {

    const modal =
        document.getElementById(
            "territoryModal"
        );


    modal.classList.remove(
        "open"
    );


    /*
       Remove visual selection from
       the selected territory card.
    */

    document
        .querySelectorAll(
            ".territory-card.selected"
        )
        .forEach(
            card => {

                card.classList.remove(
                    "selected"
                );

            }
        );

}


/* =========================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================================= */

document
    .getElementById("territoryModal")
    .addEventListener(
        "click",
        (event) => {

            if (
                event.target.id ===
                "territoryModal"
            ) {

                closeTerritoryModal();

            }

        }
    );


/* =========================================================
   RENDER EVERYTHING
========================================================= */

function renderAll() {

    renderWorldDeck();


    document.getElementById(
        "remaining"
    ).textContent =
        `${worldDeck.length}
         World Cards remaining`;


    /*
       PLAYER 1 ONLY
    */

    renderTerritoryDeck(
        1,
        player1TerritoryDeck
    );


    /*
       PLAYER 2 ONLY
    */

    renderTerritoryDeck(
        2,
        player2TerritoryDeck
    );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text) {

    document.getElementById(
        "message"
    ).innerHTML =
        text;

}


/* =========================================================
   NEW GAME
========================================================= */

function newGame() {

    /*
       Reset all three decks separately.
    */

    worldDeck = [];

    player1TerritoryDeck = [];

    player2TerritoryDeck = [];


    openTerritory = null;


    /*
       Make sure the modal is closed.
    */

    closeTerritoryModal();


    createWorldDeck();


    showMessage(
        "New World Deck shuffled."
    );


    renderAll();

}


/* =========================================================
   START GAME
========================================================= */

newGame();

</script>
