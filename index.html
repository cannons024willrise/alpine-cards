<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Deck — Browser Prototype</title>
<style>
:root{--bg:#10131a;--panel:#191e28;--panel2:#222936;--ink:#eee8d5;--muted:#9fa8b8;--gold:#d7ad55;--red:#c65d55;--green:#6ca879;--blue:#6793c7}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% -10%,#303746,#10131a 55%);color:var(--ink);font:14px/1.4 system-ui,Segoe UI,sans-serif}
header{padding:22px 28px;border-bottom:1px solid #39404d;background:#151922cc;backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
h1{margin:0;font:700 25px Georgia,serif;letter-spacing:.5px} header p{margin:4px 0 0;color:var(--muted)}
main{max-width:1250px;margin:auto;padding:22px;display:grid;grid-template-columns:1.25fr .9fr;gap:18px}
.panel{background:linear-gradient(180deg,#202632,#181d26);border:1px solid #39414f;border-radius:14px;box-shadow:0 12px 35px #0005;overflow:hidden}
.panel h2{font:700 18px Georgia,serif;margin:0;padding:15px 17px;border-bottom:1px solid #39414f}.body{padding:17px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button,select{background:#2a313e;color:var(--ink);border:1px solid #505969;border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--gold);transform:translateY(-1px)}button.primary{background:#735923;border-color:#b89145}
.deck{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.world{padding:13px;border-radius:10px;border:1px solid #47505e;background:#252c38;min-height:108px;cursor:pointer;position:relative}.world.selected{outline:2px solid var(--gold)}.world .type{font:700 17px Georgia,serif}.world .cap{color:var(--muted);margin-top:5px}.world .tag{position:absolute;right:9px;top:8px;font-size:11px;color:var(--gold)}
.cardgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.building{padding:11px;border:1px solid #414957;border-radius:9px;background:#242a34}.building b{display:block}.building small{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:8px 0}.pill{padding:4px 8px;border-radius:999px;background:#303846;color:#d9dce3;font-size:12px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:11px;background:#222934;border:1px solid #3e4653;border-radius:9px}.stat strong{display:block;font-size:20px}.muted{color:var(--muted)}
.log{max-height:235px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px}.log div{padding:6px 0;border-bottom:1px solid #303743}
.battle{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.side{border:1px solid #424a57;border-radius:10px;padding:12px}.side h3{margin:0 0 9px}.result{text-align:center;font:700 20px Georgia,serif}.winner{color:#7dcc8a}.loser{color:#dc7a70}
@media(max-width:900px){main{grid-template-columns:1fr}.deck{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><h1>WORLD DECK</h1><p>Medieval strategy game — rules-driven browser prototype</p></header>
<main>
<section class="panel">
<h2>World Deck & Placement</h2><div class="body">
<div class="controls">
<button class="primary" onclick="draw(1)">Player 1: Draw Top</button>
<button onclick="draw(2)">Player 2: Draw Bottom</button>
<button onclick="resetGame()">Reset</button>
</div>
<div id="deck" class="deck"></div>
<div id="selectedInfo" style="margin-top:15px"></div>
</div></section>

<section class="panel"><h2>Production</h2><div class="body" id="production"></div></section>

<section class="panel">
<h2>Units & Combat</h2><div class="body">
<div class="controls">
<select id="attacker"></select><select id="defender"></select>
<button class="primary" onclick="battle()">Resolve Combat</button>
</div>
<div id="battle" class="battle"></div>
</div></section>

<section class="panel"><h2>Battle Log</h2><div class="body"><div id="log" class="log"></div></div></section>
</main>
<script>
const worlds=[
 {name:"River",cap:6,build:["Farm","Residence","Tavern"],terrain:"—"},
 {name:"Mountain",cap:4,build:["Quarry","Mine","Oilfield"],terrain:"Marksman +25%"},
 {name:"Forest",cap:2,build:["Forest (automatic)"],terrain:"Infantry +25%"},
 {name:"Meadow",cap:7,build:["All other buildings"],terrain:"Rider +25%"}
];
const units=[
 ["Clubsman","Infantry",5,1],["Swordsman","Infantry",25,2],["Prototype Guard","Infantry",125,3],
 ["Archer","Marksman",5,1],["Crossbowman","Marksman",25,2],["Prototype Rifleman","Marksman",125,3],
 ["Scout","Rider",5,1],["Horseman","Rider",25,2],["Prototype Biker","Rider",125,3],
 ["Ram","Infantry Siege",10,1],["Siege Tower","Infantry Siege",100,2],["Prototype Tank","Infantry Siege",1000,3],
 ["Trebuchet","Marksman Siege",10,1],["Ballista","Marksman Siege",100,2],["Prototype Artillery","Marksman Siege",1000,3],
 ["Knight Lancer","Rider Siege",10,1],["Chariot","Rider Siege",100,2],["Prototype Jeep","Rider Siege",1000,3]
];
let deck, selected=null, log=[];
const $=id=>document.getElementById(id);
function resetGame(){deck=worlds.map(x=>({...x}));selected=null;log=["Game reset. World Deck restored."];render()}
function draw(player){if(!deck.length)return add("World Deck is empty.");const w=player===1?deck.shift():deck.pop();selected=w;add(`Player ${player} drew ${w.name} from the ${player===1?"top":"bottom"}.`);render()}
function add(x){log.unshift(x);$("log").innerHTML=log.map(x=>`<div>${x}</div>`).join("")}
function render(){
 $("deck").innerHTML=deck.map((w,i)=>`<div class="world ${selected&&selected.name===w.name?"selected":""}" onclick="selectWorld(${i})"><span class="tag">#${i+1}</span><div class="type">${w.name}</div><div class="cap">${w.cap} building cards</div><div class="muted">${w.terrain}</div></div>`).join("")||'<div class="muted">No cards remaining.</div>';
 $("selectedInfo").innerHTML=selected?`<div class="building"><b>${selected.name} Card</b><small>Capacity: ${selected.cap} cards · Defender terrain: ${selected.terrain}</small><div class="cardgrid" style="margin-top:10px">${selected.build.map(x=>`<div class="building"><b>${x}</b><small>Placement permitted by world-card rules</small></div>`).join("")}</div></div>`:"<span class='muted'>Draw or select a World Card.</span>";
 $("production").innerHTML=`
 <div class="statgrid">
  <div class="stat"><strong>+25%</strong><span class="muted">Forge → Metal</span></div>
  <div class="stat"><strong>+25%</strong><span class="muted">Mason's Yard → Stone</span></div>
  <div class="stat"><strong>+25%</strong><span class="muted">Lumber Mill → Wood</span></div>
  <div class="stat"><strong>+25%</strong><span class="muted">Oil Refinery → Oil</span></div>
  <div class="stat"><strong>+25%</strong><span class="muted">Grain Mill → Food</span></div>
  <div class="stat"><strong>+25%</strong><span class="muted">Factory → everything except Food</span></div>
 </div>
 <p class="muted">Applicable production buffs add together. Three +25% buffs = +75%, not 95.3%.</p>`;
 const opts=units.map((u,i)=>`<option value="${i}">${u[0]} · ${u[2]}</option>`).join("");$("attacker").innerHTML=opts;$("defender").innerHTML=opts;
 $("log").innerHTML=log.map(x=>`<div>${x}</div>`).join("");
}
function selectWorld(i){selected=deck[i];render()}
function info(i){let u=units[i];return {name:u[0],cls:u[1],v:u[2],lvl:u[3]}}
function counter(a,d){const A=a.cls.replace(" Siege",""),D=d.cls.replace(" Siege","");return (A==="Infantry"&&D==="Rider")||(A==="Rider"&&D==="Marksman")||(A==="Marksman"&&D==="Infantry")}
function battle(){
 const a=info(+$("attacker").value),d=info(+$("defender").value);
 let av=a.v,dv=d.v,mods=[];
 if(counter(a,d)){av*=1.25;mods.push("counter +25%")}
 if(a.cls.includes("Siege")){ // siege counters all regular units; siege-v-siege uses class triangle
   if(!d.cls.includes("Siege")){av*=1;mods.push("siege vs regular")}
   else if(counter(a,d)){av*=1.25;mods.push("siege counter +25%")}
 }
 const win=av>dv?"Attacker wins":av<dv?"Defender wins":"Draw";
 $("battle").innerHTML=`<div class="side"><h3>${a.name}</h3><div>${a.cls}</div><strong>${av.toFixed(2)}</strong><small class="muted">effective value</small></div><div class="result ${win==="Attacker wins"?"winner":win==="Defender wins"?"loser":""}">${win}<br><span class="muted">${mods.join(" · ")||"no modifiers"}</span></div><div class="side"><h3>${d.name}</h3><div>${d.cls}</div><strong>${dv.toFixed(2)}</strong><small class="muted">base value</small></div>`;
 add(`${a.name} (${av.toFixed(0)}) vs ${d.name} (${dv}) → ${win}${mods.length?" ["+mods.join(", ")+"]":""}.`);
}
resetGame();
</script>
</body>
</html>
