<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>World Deck Prototype</title>

<style>
body {
    margin: 0;
    background: #171717;
    color: #eee;
    font-family: Arial, sans-serif;
    text-align: center;
}

main {
    max-width: 900px;
    margin: 30px auto;
}

h1 {
    font-family: Georgia, serif;
}

.deck-area {
    margin: 25px 0;
}

.card {
    width: 150px;
    height: 200px;
    margin: 10px auto;
    display: flex;
    align-items: center;
    justify-content: center;

    background: #30291f;
    border: 2px solid #c9a45b;
    border-radius: 12px;

    font: 24px Georgia, serif;
    box-shadow: 8px 8px 0 #080808;
}

button {
    margin: 5px;
    padding: 10px 15px;
    background: #2b251b;
    color: white;
    border: 1px solid #806735;
    border-radius: 7px;
    cursor: pointer;
}

button:hover {
    background: #493b25;
}

.territories {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 30px;
}

.territory {
    background: #222;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 15px;
}

.territory-card {
    margin: 8px 0;
    padding: 10px;
    background: #302c26;
    border: 1px solid #555;
    border-radius: 7px;
}

#message {
    margin: 20px;
    min-height: 30px;
}

small {
    color: #aaa;
}
</style>
</head>

<body>

<main>

<h1>WORLD DECK</h1>
<small>
Randomized World Deck · P1 draws TOP · P2 draws BOTTOM
</small>

<div class="deck-area">

    <div class="card">
        WORLD DECK
    </div>

    <div id="remaining"></div>

    <button onclick="drawWorld(1)">
        Player 1 — Draw Top
    </button>

    <button onclick="drawWorld(2)">
        Player 2 — Draw Bottom
    </button>

    <button onclick="newGame()">
        New Game
    </button>

</div>

<div id="message">
No World Card drawn yet.
</div>


<div class="territories">

    <div class="territory">
        <h2>PLAYER 1 TERRITORY DECK</h2>
        <div id="player1"></div>
    </div>

    <div class="territory">
        <h2>PLAYER 2 TERRITORY DECK</h2>
        <div id="player2"></div>
    </div>

</div>

</main>


<script>

const worldTypes = {

    River: {
        capacity: 6,
        buildings: [
            "Farm",
            "Residence",
            "Tavern"
        ]
    },

    Mountain: {
        capacity: 4,
        buildings: [
            "Quarry",
            "Mine",
            "Oilfield"
        ]
    },

    Forest: {
        capacity: 2,
        buildings: [
            "Forest (automatic)"
        ]
    },

    Meadow: {
        capacity: 7,
        buildings: [
            "All other buildings"
        ]
    }

};


let worldDeck = [];

let player1Territory = [];
let player2Territory = [];


/*
    RANDOM WORLD DECK COMPOSITION

    Each World Card type receives
    a random number of copies.
*/
function createWorldDeck() {

    worldDeck = [];

    for (const type of Object.keys(worldTypes)) {

        const copies =
            3 + Math.floor(Math.random() * 4);

        for (let i = 0; i < copies; i++) {
            worldDeck.push(type);
        }

    }

    shuffle(worldDeck);
}


/*
    Fisher-Yates shuffle
*/
function shuffle(deck) {

    for (let i = deck.length - 1; i > 0; i--) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [deck[i], deck[j]] =
            [deck[j], deck[i]];
    }

}


/*
    PLAYER 1:
    removes card from TOP
*/
function drawWorld(player) {

    if (worldDeck.length === 0) {
        showMessage("The World Deck is empty.");
        return;
    }

    let card;

    if (player === 1) {

        card = worldDeck.shift();

        player1Territory.push(card);

    } else {

        card = worldDeck.pop();

        player2Territory.push(card);

    }

    const data = worldTypes[card];

    showMessage(
        `Player ${player} acquired a ${card} World Card.`
    );

    renderTerritories();

    document.getElementById("message").innerHTML +=
        `<br><small>
        Capacity: ${data.capacity}
        </small>`;

    renderDeckCount();
}


/*
    Territory Decks contain
    the actual collected cards.
*/
function renderTerritories() {

    document.getElementById("player1").innerHTML =
        renderTerritory(player1Territory);

    document.getElementById("player2").innerHTML =
        renderTerritory(player2Territory);

}


function renderTerritory(territory) {

    if (territory.length === 0) {

        return "<small>Empty</small>";

    }

    return territory.map(
        (card, index) => {

            const data =
                worldTypes[card];

            return `
                <div class="territory-card">

                    <b>${card}</b>

                    <br>

                    <small>
                        ${data.capacity}
                        building slots
                    </small>

                </div>
            `;

        }
    ).join("");

}


function renderDeckCount() {

    document.getElementById("remaining").innerText =
        `${worldDeck.length} World Cards remaining`;

}


function showMessage(text) {

    document.getElementById("message").innerHTML =
        text;

}


function newGame() {

    player1Territory = [];

    player2Territory = [];

    createWorldDeck();

    renderTerritories();

    renderDeckCount();

    showMessage(
        "New World Deck shuffled."
    );

}


newGame();

</script>

</body>
</html>
